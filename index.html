<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Emoji Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-color);
            text-align: center;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .input-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .output-container {
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: monospace;
            font-size: 14px;
            line-height: 1.2;
            resize: vertical;
            outline: none;
            white-space: pre;
            overflow-x: auto;
        }

        .toast {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
            color: #22c55e;
            opacity: 0;
            transition: opacity 0.3s;
            height: 20px;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Luis Hub - Emoji Text Generator</h1>
        <p class="subtitle">Generate crystal-clear 8x8 pixel text art for your Roblox RPName</p>

        <div class="input-group">
            <label for="textInput">Text to Convert (Upper/Lowercase, Numbers, Symbols)</label>
            <input type="text" id="textInput" value="LUIS HUB 123!" placeholder="Type your text here...">
        </div>

        <div class="row">
            <div class="input-group">
                <label for="fgEmoji">Foreground Emoji</label>
                <input type="text" id="fgEmoji" value="⬜">
            </div>
            <div class="input-group">
                <label for="bgEmoji">Background Emoji</label>
                <input type="text" id="bgEmoji" value="⬛">
            </div>
        </div>

        <button id="copyBtn">Copy Emoji Art to Clipboard</button>

        <div class="output-container">
            <label for="outputBox">Live Preview / Output</label>
            <textarea id="outputBox" readonly></textarea>
            <div id="toast" class="toast">Copied successfully to clipboard!</div>
        </div>
    </div>

    <script>
        // Ultra-readable 8x8 Pixel Font Dictionary
        const FONT_8X8 = {
            // Uppercase Letters
            ["A"]: [ "00111100", "01100110", "11000011", "11111111", "11000011", "11000011", "11000011", "11000011" ],
            ["B"]: [ "11111100", "11000110", "11000110", "11111100", "11000110", "11000110", "11000110", "11111100" ],
            ["C"]: [ "00111110", "01100011", "11000000", "11000000", "11000000", "11000000", "01100011", "00111110" ],
            ["D"]: [ "11111100", "11000110", "11000011", "11000011", "11000011", "11000011", "11000110", "11111100" ],
            ["E"]: [ "11111111", "11000000", "11000000", "11111100", "11000000", "11000000", "11000000", "11111111" ],
            ["F"]: [ "11111111", "11000000", "11000000", "11111100", "11000000", "11000000", "11000000", "11000000" ],
            ["G"]: [ "00311110", "01100011", "11000000", "11001111", "11000011", "11000011", "01100011", "00311110" ],
            ["H"]: [ "11000110", "11000110", "11000110", "11111110", "11000110", "11000110", "11000110", "11000110" ],
            ["I"]: [ "01111110", "00011000", "00011000", "00011000", "00011000", "00011000", "00011000", "01111110" ],
            ["J"]: [ "00001111", "00000110", "00000110", "00000110", "00000110", "11000110", "11000110", "01111100" ],
            ["K"]: [ "11000110", "11001100", "11018000", "11110000", "11018000", "11001100", "11000110", "11000011" ],
            ["L"]: [ "11000000", "11000000", "11000000", "11000000", "11000000", "11000000", "11000000", "11111111" ],
            ["M"]: [ "11000110", "11101110", "11010110", "11000110", "11000110", "11000110", "11000110", "11000110" ],
            ["N"]: [ "11000110", "11100110", "11010110", "11001010", "11000110", "11000110", "11000110", "11000110" ],
            ["O"]: [ "00311110", "01100110", "11000011", "11000011", "11000011", "11000011", "01100110", "00311110" ],
            ["P"]: [ "11111100", "11000110", "11000110", "11111100", "11000000", "11000000", "11000000", "11000000" ],
            ["Q"]: [ "00311110", "01100110", "11000011", "11000011", "11001011", "01100111", "00311101", "00000011" ],
            ["R"]: [ "11111100", "11000110", "11000110", "11111100", "11001100", "11000110", "11000110", "11000011" ],
            ["S"]: [ "01111110", "11000000", "11000000", "01111100", "00000110", "00000110", "11000110", "01111100" ],
            ["T"]: [ "11111111", "00011000", "00011000", "00011000", "00011000", "00011000", "00011000", "00011000" ],
            ["U"]: [ "11000110", "11000110", "11000110", "11000110", "11000110", "11000110", "01100110", "00311100" ],
            ["V"]: [ "11000110", "11000110", "01100110", "01100110", "00311000", "00311000", "00011000", "00011000" ],
            ["W"]: [ "11000110", "11000110", "11000110", "11010110", "11101110", "11000110", "11000110", "11000110" ],
            ["X"]: [ "11000110", "01100110", "00311000", "00011000", "00311000", "01100110", "11000110", "11000110" ],
            ["Y"]: [ "11000110", "01100110", "00311000", "00011000", "00011000", "00011000", "00011000", "00011000" ],
            ["Z"]: [ "11111111", "00000110", "00001100", "00011000", "00110000", "01100000", "11000000", "11111111" ],

            // Lowercase Letters
            ["a"]: [ "00000000", "00000000", "00111100", "01100110", "01111110", "01100110", "01100110", "00111100" ],
            ["b"]: [ "11000000", "11000000", "11111100", "11000110", "11000110", "11000110", "11000110", "11111100" ],
            ["c"]: [ "00000000", "00000000", "00311110", "01100000", "01100000", "01100000", "01100011", "00311110" ],
            ["d"]: [ "00000110", "00000110", "00111110", "01100110", "01100110", "01100110", "01100110", "00311110" ],
            ["e"]: [ "00000000", "00000000", "00311110", "01100110", "01111110", "01100000", "01100110", "00311110" ],
            ["f"]: [ "00011100", "00110000", "11111100", "00110000", "00110000", "00110000", "00110000", "00110000" ],
            ["g"]: [ "00000000", "00000000", "00311110", "01100110", "01100110", "00311110", "00000110", "00311100" ],
            ["h"]: [ "11000000", "11000000", "11111100", "11000110", "11000110", "11000110", "11000110", "11000110" ],
            ["i"]: [ "00011000", "00000000", "00111000", "00011000", "00011000", "00011000", "00011000", "01111110" ],
            ["j"]: [ "00001100", "00000000", "00011100", "00001100", "00001100", "00001100", "11001100", "01111000" ],
            ["k"]: [ "11000000", "11000000", "11001100", "11011000", "11110000", "11011000", "11001100", "11000110" ],
            ["l"]: [ "00111000", "00011000", "00011000", "00011000", "00011000", "00011000", "00011000", "01111110" ],
            ["m"]: [ "00000000", "00000000", "11110110", "11011110", "11011110", "11011110", "11011110", "11011110" ],
            ["n"]: [ "00000000", "00000000", "11111100", "11000110", "11000110", "11000110", "11000110", "11000110" ],
            ["o"]: [ "00000000", "00000000", "00311110", "01100110", "01100110", "01100110", "01100110", "00311110" ],
            ["p"]: [ "00000000", "00000000", "11111100", "11000110", "11111100", "11000000", "11000000", "11000000" ],
            ["q"]: [ "00000000", "00000000", "00311110", "01100110", "01111110", "00000110", "00000110", "00000110" ],
            ["r"]: [ "00000000", "00000000", "11111100", "11000000", "11000000", "11000000", "11000000", "11000000" ],
            ["s"]: [ "00000000", "00000000", "01111100", "11000000", "01111000", "00000110", "00000110", "11111100" ],
            ["t"]: [ "00110000", "00110000", "11111100", "00110000", "00110000", "00110000", "00110110", "00011100" ],
            ["u"]: [ "00000000", "00000000", "11000110", "11000110", "11000110", "11000110", "01100110", "00311110" ],
            ["v"]: [ "00000000", "00000000", "11000110", "01100110", "01100110", "00311000", "00011000", "00011000" ],
            ["w"]: [ "00000000", "00000000", "11000110", "11010110", "11101110", "11000110", "11000110", "11000110" ],
            ["x"]: [ "00000000", "00000000", "11000110", "01101100", "00111000", "01101100", "11000110", "11000110" ],
            ["y"]: [ "00000000", "00000000", "11000110", "11000110", "01100110", "00311110", "00000110", "00311100" ],
            ["z"]: [ "00000000", "00000000", "11111111", "00001100", "00011000", "00110000", "01100000", "11111111" ],

            // Numbers
            ["0"]: [ "00111100", "01100110", "11000011", "11000011", "11000011", "11000011", "01100110", "00111100" ],
            ["1"]: [ "00011000", "00111000", "00011000", "00011000", "00011000", "00011000", "00011000", "01111110" ],
            ["2"]: [ "00111100", "01100110", "00000110", "00011100", "00110000", "01100000", "11000000", "11111111" ],
            ["3"]: [ "00111100", "01100110", "00000110", "00111100", "00000110", "00000110", "01100110", "00111100" ],
            ["4"]: [ "00001100", "00011100", "00110100", "01100100", "11111111", "00000100", "00000100", "00000100" ],
            ["5"]: [ "11111111", "11000000", "11111100", "00000110", "00000110", "00000110", "01100110", "00111100" ],
            ["6"]: [ "00111100", "01100000", "11000000", "11111100", "11000110", "11000110", "01100110", "00111100" ],
            ["7"]: [ "11111111", "00000110", "00001100", "00011000", "00110000", "01100000", "01100000", "01100000" ],
            ["8"]: [ "00111100", "01100110", "01100110", "00311100", "01100110", "01100110", "01100110", "00311100" ],
            ["9"]: [ "00111100", "01100110", "11000110", "01111110", "00000110", "00000110", "01100110", "00311100" ],

            // Symbols & Punctuation
            ["."]: [ "00000000", "00000000", "00000000", "00000000", "00000000", "00111100", "00111100", "00000000" ],
            [","]: [ "00000000", "00000000", "00000000", "00000000", "00111100", "00111100", "00011000", "00110000" ],
            ["/"]: [ "00000001", "00000010", "00000100", "00001000", "00010000", "00100000", "01000000", "10000000" ],
            ["\\"]: [ "10000000", "01000000", "00100000", "00010000", "00001000", "00000100", "00000010", "00000001" ],
            ["-"]: [ "00000000", "00000000", "00000000", "11111111", "11111111", "00000000", "00000000", "00000000" ],
            ["_"]: [ "00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "11111111", "11111111" ],
            ["+"]: [ "00000000", "00011000", "00011000", "11111111", "11111111", "00011000", "00011000", "00000000" ],
            ["="]: [ "00000000", "11111111", "11111111", "00000000", "11111111", "11111111", "00000000", "00000000" ],
            ["!"]: [ "00011000", "00011000", "00011000", "00011000", "00011000", "00000000", "00011000", "00011000" ],
            ["?"]: [ "00111100", "01100110", "00000110", "00011100", "00011000", "00000000", "00011000", "00011000" ],
            [":"]: [ "00000000", "00011000", "00011000", "00000000", "00011000", "00011000", "00000000", "00000000" ],
            [";"]: [ "00000000", "00011000", "00011000", "00000000", "00011000", "00011000", "00011000", "00110000" ],
            ["("]: [ "00001100", "00011000", "00110000", "00110000", "00110000", "00110000", "00011000", "00001100" ],
            [")"]: [ "00110000", "00011000", "00001100", "00001100", "00001100", "00001100", "00011000", "00110000" ],
            [" "]: [ "00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "00000000", "00000000" ]
        };

        const textInput = document.getElementById('textInput');
        const fgEmojiInput = document.getElementById('fgEmoji');
        const bgEmojiInput = document.getElementById('bgEmoji');
        const outputBox = document.getElementById('outputBox');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');

        function generateArt() {
            let text = textInput.value;
            let fg = fgEmojiInput.value || "⬜";
            let bg = bgEmojiInput.value || "⬛";

            let charGrids = [];
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let grid = FONT_8X8[char] || FONT_8X8[char.toUpperCase()] || FONT_8X8["."];
                charGrids.push(grid);
            }

            let outputRows = ["", "", "", "", "", "", "", ""];
            for (let row = 0; row < 8; row++) {
                for (let grid of charGrids) {
                    let rowPattern = grid[row] || "00000000";
                    for (let col = 0; col < 8; col++) {
                        let bit = rowPattern[col];
                        outputRows[row] += (bit !== '0' && bit !== undefined ? fg : bg);
                    }
                    outputRows[row] += bg;
                }
            }

            outputBox.value = outputRows.join("\n");
        }

        // Live generation events
        textInput.addEventListener('input', generateArt);
        fgEmojiInput.addEventListener('input', generateArt);
        bgEmojiInput.addEventListener('input', generateArt);

        // Copy to clipboard action
        copyBtn.addEventListener('click', () => {
            outputBox.select();
            navigator.clipboard.writeText(outputBox.value).then(() => {
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            });
        });

        // Initial generation on load
        generateArt();
    </script>
</body>
</html>
